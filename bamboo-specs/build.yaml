---
version: 2
plan:
  project-key: AJL
  key: DDLBUILD
  name: dead-domains-linter  -  build

stages:
  - Build:
      manual: false
      final: false
      jobs:
        - Build

Build:
  key: BUILD
  other:
    clean-working-dir: true
  tasks:
    - checkout:
        force-clean-build: true
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -ex

            # Fix mixed logs
            exec 2>&1

            export DOCKER_BUILDKIT=1

            docker build \
              --file Dockerfile \
              --progress plain \
              --build-arg BUILD_RUN_ID=${bamboo.buildNumber} \
              --target build-output \
              --output type=local,dest=output \
              .

            mv output/artifacts/dead-domains-linter.tgz ./dead-domains-linter.tgz
            mv output/artifacts/build.txt ./build.txt
    - inject-variables:
        file: build.txt
        scope: RESULT
        namespace: inject
    - any-task:
        plugin-key: com.atlassian.bamboo.plugins.vcs:task.vcs.tagging
        configuration:
          selectedRepository: defaultRepository
          tagName: v${bamboo.inject.version}
  final-tasks:
    - script:
        interpreter: SHELL
        scripts:
          - "./bamboo-specs/scripts/cleanup.sh dead-domains-linter.tgz"
  artifacts:
    - name: dead-domains-linter.tgz
      location: .
      pattern: dead-domains-linter.tgz
      shared: true
      required: true
  requirements:
    - adg-docker: "true"

triggers: []

branches:
  create: manually
  delete: never
  link-to-jira: true

labels: []

other:
  concurrent-build-plugin: system-default
